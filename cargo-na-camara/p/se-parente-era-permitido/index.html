<h1>Se alguém disser: “Contratar parente era permitido.”</h1>
<p>Em 2000, era. A proibição veio em 2008, com uma súmula do STF. A questão aqui é outra: o cargo só podia ser exercido em Brasília, e ele estava matriculado num curso com aula todo dia no Rio.</p>
